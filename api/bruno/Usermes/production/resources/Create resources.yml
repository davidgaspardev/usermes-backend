info:
  name: Create resources
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseURL}}/v1/api/production/locations/:location_code/resources/"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: location_code
      value: PLANT-01
      type: path
  body:
    type: json
    data: |-
      {
        "code": "RES-01",
        "type": "MACHINE",
        "stop_factor": 0,
        "shift_id": null,
        "tags": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
