# golangci-lint configuration v1.64+
# https://golangci-lint.run/usage/configuration/

linters-settings:
  dupl:
    threshold: 100
    
  errcheck:
    check-type-assertions: true
    check-blank: true
    
  funlen:
    lines: 100
    statements: 50
    
  goconst:
    min-len: 2
    min-occurrences: 2
    
  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - dupImport
      - ifElseChain
      - octalLiteral
      - whyNoLint
      - wrapperFunc
      
  gocyclo:
    min-complexity: 15
    
  goimports:
    local-prefixes: github.com/davidgaspardev/usermes-backend
    
  govet:
    enable-all: true
    disable:
      - shadow
      
  lll:
    line-length: 140
    
  misspell:
    locale: US
    
  nolintlint:
    allow-unused: false
    require-explanation: false
    require-specific: false

linters:
  disable-all: true
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gofmt
    - goimports
    - goprintffuncname
    - gosec
    # gosimple disabled due to typecheck false positives with module imports (megacheck)
    # - gosimple
    # govet disabled due to typecheck false positives with module imports  
    # - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    # staticcheck disabled due to typecheck false positives with module imports (megacheck)
    # - staticcheck
    - stylecheck
    # typecheck disabled due to false positives with module imports
    # - typecheck
    - unconvert
    - unparam
    # unused disabled due to typecheck false positives with module imports (megacheck)
    # - unused
    - whitespace

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - funlen
        - goconst
        - dupl
    - path: cmd/
      linters:
        - gochecknoinits
    # Exclude typecheck errors for fiber imports (false positives with golangci-lint)
    - text: "undefined: fiber"
      linters:
        - typecheck
        
  max-issues-per-linter: 0
  max-same-issues: 0

run:
  timeout: 5m
  tests: true
  # Use go.mod to determine modules
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
