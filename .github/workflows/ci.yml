name: CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.1"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Please run 'go fmt ./...'"
            gofmt -s -l .
            exit 1
          fi

      - name: Run tests with coverage (Business Logic Only)
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic \
            ./internal/modules/user/domain/... \
            ./internal/modules/user/application/... \
            ./internal/modules/resource/domain/... \
            ./internal/modules/resource/application/...

      - name: Calculate coverage
        id: coverage
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "🎯 BUSINESS LOGIC COVERAGE (Domain + Application)"
          echo "=========================================="
          echo "📊 Total coverage: $COVERAGE%"
          echo "🎚️  Threshold:      85.0%"
          echo "📦 Packages tested:"
          echo "   • Domain entities & value objects"
          echo "   • Application use cases"
          echo "❌ Excluded: Infrastructure, DTOs, HTTP handlers"
          echo "=========================================="

      - name: Check coverage threshold
        run: |
          COVERAGE=${{ steps.coverage.outputs.coverage }}
          THRESHOLD=85.0

          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Business Logic coverage $COVERAGE% is below threshold $THRESHOLD%"
            echo "💡 Focus on testing domain entities and use cases"
            exit 1
          else
            echo "✅ Business Logic coverage $COVERAGE% meets threshold $THRESHOLD%"
            echo "🚀 Great! Your core business logic is well tested"
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Generate coverage report
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.html
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.1"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.1"
          cache: true

      - name: Build
        run: go build -v -o bin/usermes-backend ./cmd/main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: usermes-backend
          path: bin/usermes-backend
          retention-days: 7
