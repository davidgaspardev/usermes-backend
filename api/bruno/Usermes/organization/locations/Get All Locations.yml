info:
  name: Get All Locations
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/v1/api/organization/locations/"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{authToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
