info:
  name: Login user
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3001/v1/api/iam/users/login
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "dvd",
        "password": "test1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
