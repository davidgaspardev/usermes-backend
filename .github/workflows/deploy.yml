name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check EC2_KEY secret
        run: |
          if [ -z "${{ secrets.EC2_KEY }}" ]; then
            echo "EC2_KEY is empty or not set!"
            exit 1
          else
            echo "EC2_KEY is set."
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -o app ./cmd

      - name: Upload SSH key
        run: |
          echo "${{ secrets.AWS_EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Add EC2 host key to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan ${{ secrets.AWS_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy binary to EC2
        run: |
          scp -i key.pem app ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }}:/home/${{ secrets.AWS_EC2_USER }}/app

      - name: Restart app on EC2
        run: |
          ssh -i key.pem ${{ secrets.AWS_EC2_USER }}@${{ secrets.AWS_EC2_HOST }} "pkill app || true && nohup /home/${{ secrets.AWS_EC2_USER }}/app > app.log 2>&1 &"

      - name: Cleanup SSH key
        if: always()
        run: rm -f key.pem
