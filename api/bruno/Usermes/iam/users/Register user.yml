info:
  name: Register user
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3001/v1/api/iam/users/register
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "David",
        "username": "dvd",
        "password": "test1234",
        "email": "dvd@test.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
